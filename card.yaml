# Card for the floor-plan model.
# Remote setup (current): model pinned to the commit that contains it.
# raw.githubusercontent.com caches master for ~5 min and ignores ?v=;
# a commit SHA URL is immutable and available immediately.
# Local dev on the LAN: set path: http://192.168.1.4:8765/
# Permanent HA-local setup: copy home.obj + home.mtl to /config/www/floor3d/
# and set path: /local/floor3d/.
type: custom:floor3d-card-sims
name: Home 3D
path: https://raw.githubusercontent.com/c0pper/homeassistant-3d-card/0b3b367/
objfile: home.obj
mtlfile: home.mtl
header: 'no'
backgroundColor: sky
exposure: 1.15
tone_mapping: neutral
light_power: 1
# torch light: brighter at night (sensor.floor3d_ambient_power, 0.75 night / 0.25 day)
globalLightPower: sensor.floor3d_ambient_power
sun: 'yes'
sun_power: 1
sky_power: 0.55
sky_color: '#e6eeff'
ground_color: '#706458'
shadow: 'yes'
north:
  x: 0
  z: -1
click: 'yes'
# sims: near walls show the closed 20 cm stub, far walls stay full.
# The split at 20 cm is baked into home.obj (wall_sims_low_*/wall_sims_high_*).
walls: sims
camera_position:
  x: 0
  y: 1500
  z: 850
camera_target:
  x: 0
  y: 150
  z: 0
zoom_areas:
  - zoom: Whole home
    object_id: floor_base
    direction: {x: 0.2, y: 1, z: 0.55}
    distance: 1900
  - zoom: Bedroom
    object_id: room_left
    direction: {x: 0, y: 1, z: 0.45}
    distance: 650
  - zoom: Studio
    object_id: room_right
    direction: {x: 0, y: 1, z: 0.45}
    distance: 800
  - zoom: Kitchen
    object_id: room_kitchen
    direction: {x: 0, y: 1, z: 0.45}
    distance: 700
  - zoom: Living room
    object_id: room_living
    direction: {x: 0, y: 1, z: 0.45}
    distance: 800
  - zoom: Master bath
    object_id: room_wc1
    direction: {x: 0, y: 1, z: 0.45}
    distance: 600
entities:
  - entity: light.living_room_ball_lamp
    type3d: light
    object_id: light_living_room_ball_lamp
    action: more-info
    light:
      lumens: 700
  - entity: light.bedside_lamp
    type3d: light
    object_id: light_bedside_lamp
    action: more-info
    light:
      lumens: 400
  - entity: light.mood_lights
    type3d: light
    object_id: light_mood_lights
    action: more-info
    light:
      lumens: 500
  - entity: light.bedroom_ceiling_bulbs
    type3d: light
    object_id: light_bedroom_ceiling_bulbs
    action: more-info
    light:
      lumens: 800
  - entity: light.pc_keyboard_led_strip
    type3d: light
    object_id: light_pc_keyboard_led_strip
    action: more-info
    light:
      lumens: 300
