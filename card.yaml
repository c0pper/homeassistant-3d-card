# Card for the floor-plan model.
# Permanent setup: copy home.obj + home.mtl to /config/www/floor3d/
# and keep path: /local/floor3d/.
# Temporary preview: set path: http://192.168.1.4:8765/
type: custom:floor3d-card
name: Home 3D
path: /local/floor3d/
objfile: home.obj
mtlfile: home.mtl
header: 'no'
backgroundColor: '#0f172a'
globalLightPower: 0.55
shadow: 'no'
click: 'yes'
walls: fade
walls_opacity: 0.18
camera_position:
  x: 0
  y: 1500
  z: 850
camera_target:
  x: 0
  y: 150
  z: 0
zoom_areas:
  - zoom: Whole home
    object_id: floor_base
    direction: {x: 0.2, y: 1, z: 0.55}
    distance: 1900
  - zoom: Bedroom
    object_id: room_left
    direction: {x: 0, y: 1, z: 0.45}
    distance: 650
  - zoom: Studio
    object_id: room_right
    direction: {x: 0, y: 1, z: 0.45}
    distance: 800
  - zoom: Kitchen
    object_id: room_kitchen
    direction: {x: 0, y: 1, z: 0.45}
    distance: 700
  - zoom: Living room
    object_id: room_living
    direction: {x: 0, y: 1, z: 0.45}
    distance: 800
  - zoom: Master bath
    object_id: room_wc1
    direction: {x: 0, y: 1, z: 0.45}
    distance: 600
entities:
  - entity: light.living_room_ball_lamp
    type3d: light
    object_id: light_living_room_ball_lamp
    action: more-info
    light:
      lumens: 700
  - entity: light.bedside_lamp
    type3d: light
    object_id: light_bedside_lamp
    action: more-info
    light:
      lumens: 400
  - entity: light.mood_lights
    type3d: light
    object_id: light_mood_lights
    action: more-info
    light:
      lumens: 500
  - entity: light.bedroom_ceiling_bulbs
    type3d: light
    object_id: light_bedroom_ceiling_bulbs
    action: more-info
    light:
      lumens: 800
  - entity: light.pc_keyboard_led_strip
    type3d: light
    object_id: light_pc_keyboard_led_strip
    action: more-info
    light:
      lumens: 300
