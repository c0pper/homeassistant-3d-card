# Add this as a card (panel view recommended) after the model files are in
# /config/www/floor3d/ and floor3d-card is installed.
type: custom:floor3d-card
name: Home 3D
path: /local/floor3d/
objfile: home.obj
mtlfile: home.mtl
backgroundColor: '#0b1220'
globalLightPower: 0.55
shadow: 'no'
click: 'yes'
entities:
  - entity: light.living_room_ball_lamp
    type3d: light
    object_id: light_living_room_ball_lamp
    action: more-info
    light:
      lumens: 700
  - entity: light.bedside_lamp
    type3d: light
    object_id: light_bedside_lamp
    action: more-info
    light:
      lumens: 400
  - entity: light.mood_lights
    type3d: light
    object_id: light_mood_lights
    action: more-info
    light:
      lumens: 500
  - entity: light.bedroom_ceiling_bulbs
    type3d: light
    object_id: light_bedroom_ceiling_bulbs
    action: more-info
    light:
      lumens: 800
  - entity: light.pc_keyboard_led_strip
    type3d: light
    object_id: light_pc_keyboard_led_strip
    action: more-info
    light:
      lumens: 300
  - entity: binary_sensor.entrance_door_contact
    type3d: door
    object_id: door_entrance
    action: more-info
    door:
      doortype: swing
      side: left
      direction: inner
      degrees: 85
  - entity: binary_sensor.balcone_lato_cucina_contact
    type3d: door
    object_id: door_balcony
    action: more-info
    door:
      doortype: swing
      side: right
      direction: inner
      degrees: 70
